name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The bundled rapidocr-onnxruntime 1.4 backend requires Python < 3.13.
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements/requirements-core.txt
            requirements/requirements-test.txt
            requirements/requirements-attachments.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements/requirements-test.txt
      - name: Install CJK fonts (Linux)
        if: runner.os == 'Linux'
        # The PDF fixture uses a non-embedded CJK font; PDFium needs a system
        # CJK font (via fontconfig) to render it for the OCR test.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fontconfig
          fc-match 'Heiti' || true
      - name: Check dependency consistency
        run: python -m pip check
      - name: Validate contracts
        run: python -X utf8 -B -m pcb_assistant.interfaces.contract --validate
      - name: Validate evaluation cases
        run: python -X utf8 -B -m pcb_assistant.evaluation.cases --validate
      - name: Validate tool mapping
        run: python -X utf8 -B -m pcb_assistant.interfaces.mapping
      - name: Run synthetic regression suite
        run: python -X utf8 -B -m unittest discover -v
